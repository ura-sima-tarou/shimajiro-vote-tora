name: vote

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: vote
  cancel-in-progress: false

jobs:
  vote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx[http2]
      - run: python vote.py
        env:
          WORKERS: '600'
          DURATION_SECONDS: '285'
          TARGET_ID: '3436'
          AMOUNT: '5000000000000000'
          STATS_URL: 'https://issued-medline-health-effectively.trycloudflare.com/api/node-stats'
          NODE_NAME: 'github-actions-tora-${{ matrix.shard }}'
